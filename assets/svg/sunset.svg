<svg width="32" height="32" version="1.1" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
 <!-- Sun circle at horizon with warmer sunset color -->
 <circle cx="16" cy="24" r="6" fill="#ff6b35"/>
 
 <!-- Sun rays with sunset color -->
 <!-- Top ray -->
 <rect x="15" y="12" width="2" height="3" rx="1" fill="#ff6b35"/>
 <!-- Top-left ray -->
 <rect x="9.5" y="14.5" width="2" height="3" rx="1" transform="rotate(-45 10.5 16)" fill="#ff6b35"/>
 <!-- Top-right ray -->
 <rect x="20.5" y="14.5" width="2" height="3" rx="1" transform="rotate(45 21.5 16)" fill="#ff6b35"/>
 <!-- Left ray -->
 <rect x="6" y="23" width="3" height="2" rx="1" fill="#ff6b35"/>
 <!-- Right ray -->
 <rect x="23" y="23" width="3" height="2" rx="1" fill="#ff6b35"/>
 
 <!-- Horizon line -->
 <line x1="2" y1="24" x2="30" y2="24" stroke="#ff6b35" stroke-width="1.5" stroke-linecap="round"/>
 
 <!-- Down arrow to indicate setting sun -->
 <path d="m16 27 2-2m-2 2-2-2" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
 
 <!-- Highlight overlay on sun -->
 <path d="m10 24a6 6 0 0 1 6-6 6 6 0 0 1 6 6" fill="#fff" opacity="0.3"/>
 
 <!-- Shadow overlay on sun -->
 <path d="m10 24a6 6 0 0 0 6 6 6 6 0 0 0 6-6" fill="#000" opacity="0.15"/>
</svg>
